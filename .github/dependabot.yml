# Automated dependency updates. Dependabot opens a pull request for each update;
# nothing is merged until a human approves it (enforced by branch protection on `main`).
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # The playground itself (what users get when they open the template in StackBlitz).
  - package-ecosystem: npm
    directory: /playground
    schedule:
      interval: daily
      time: '06:00'
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'deps(playground)'
    labels:
      - dependencies
    # Give third-party releases a few days to settle (and get yanked if compromised)
    # before proposing them. Cimpress UI is our own and should be picked up right away.
    cooldown:
      default-days: 3
      semver-major-days: 7
      exclude:
        - '@cimpress-ui/*'
    groups:
      # All Cimpress UI packages move together in a single PR.
      cimpress-ui:
        patterns:
          - '@cimpress-ui/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      playground-tooling:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Repository tooling (ESLint, Prettier, TypeScript, ...).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Amsterdam
    commit-message:
      prefix: 'deps(tooling)'
    labels:
      - dependencies
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
      tooling:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Keep the GitHub Actions used by our workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Amsterdam
    commit-message:
      prefix: 'deps(actions)'
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'
